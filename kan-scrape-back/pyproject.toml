[project]
name = "kan-scrape-back"
version = "0.1.0"
description = "Kan Scrape API — backend services for the Kansai events scraper"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.28.1",
    "mistralai>=2.9.4",
    "icalendar>=7.3.0",
    "python-multipart>=0.0.32",
    "faster-whisper>=1.2.1",
    "edge-tts>=7.2.8",
    # CUDA 12 runtime for ctranslate2. No macOS wheels exist and they are useless without
    # an NVIDIA GPU, so keep them off Darwin — the Mac path runs on CPU or MLX.
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9.24.0.43; sys_platform != 'darwin'",
]

[project.optional-dependencies]
# Apple Silicon GPU (Metal) backend. Optional because it drags in torch/numba/scipy (~2 GB)
# and only installs on darwin/arm64: `uv sync --extra mlx`.
mlx = ["mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a real model/GPU; set RUN_STT_INTEGRATION=1"]
